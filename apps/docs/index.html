<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jali</title>
    <meta name="description" content="Workspaces of panes for React, that fit the space they have." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:image" content="/jali-social.png" />
    <meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13120f" media="(prefers-color-scheme: dark)" />
    <!-- Layer order first: the docs page resets, then Jali, then the docs' own styles. -->
    <style>@layer docs-base, jali, docs;</style>
    <!-- The theme before the first paint: data-theme is the resolved theme, as @jali/core sets it (src/site/theme.ts). -->
    <script>
      (function () {
        var c = "system";
        try { c = localStorage.getItem("jali-docs-theme") || "system"; } catch (e) {}
        var dark = c === "dark" || (c !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-choice", c === "light" || c === "dark" ? c : "system");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
